[project]
name = "distilhead"
version = "0.0.1"
description = "Frozen small encoder plus trained heads, distilled from an LLM teacher, for offline classification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6,<7"]

[project.scripts]
distilhead = "distilhead.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distilhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
